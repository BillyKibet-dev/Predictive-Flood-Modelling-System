# API only: the dashboard is served by Netlify. Replace api.example.co.ke with your API host,
# copy to /etc/nginx/sites-available/nairobifloodwatch and run certbot (AZURE_DEPLOYMENT.md, step 8).
limit_req_zone $binary_remote_addr zone=flood_reports:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=flood_lookups:10m rate=30r/m;

server {
    listen 80;
    server_name api.example.co.ke;
    # certbot --nginx adds the HTTPS server and the redirect below.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.example.co.ke;
    ssl_certificate /etc/letsencrypt/live/api.example.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.co.ke/privkey.pem;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Old prediction endpoints stay closed in this release.
    location = /predictions/run-pipeline { return 403; }
    location = /api/v1/predictions/run { return 403; }

    # Public writes: a few per minute per address.
    location = /citizen-report {
        limit_req zone=flood_reports burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/floodwatch-proxy.conf;
    }
    # One photo per report (the API re-encodes it; 8 MB limit there too).
    location ~ ^/citizen-report/[0-9]+/photo$ {
        client_max_body_size 9m;
        limit_req zone=flood_reports burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/floodwatch-proxy.conf;
    }
    # Status checks, place search and route checks (the API also limits route checks).
    location ~ ^/(citizen-report/status|routes/) {
        limit_req zone=flood_lookups burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/floodwatch-proxy.conf;
    }
    location / {
        # A manual admin collection can outlive normal read timeouts.
        proxy_read_timeout 90s;
        include /etc/nginx/snippets/floodwatch-proxy.conf;
    }
}
