# INERT EXAMPLE. Replace domains, certificate paths, root and upstream after approval.
# Include in nginx's http context. No configuration was installed or activated.
limit_req_zone $binary_remote_addr zone=flood_reports:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name flood.example.invalid;
    ssl_certificate /etc/letsencrypt/live/flood.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flood.example.invalid/privkey.pem;
    root /srv/nairobifloodwatch/dashboard/dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name api.flood.example.invalid;
    ssl_certificate /etc/letsencrypt/live/api.flood.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flood.example.invalid/privkey.pem;
    client_max_body_size 64k;

    # Scheduler flags do not disable the existing manual prediction HTTP routes.
    # Keep these unavailable in the initial application-only release.
    location = /predictions/run-pipeline { return 403; }
    location = /api/v1/predictions/run { return 403; }

    location = /citizen-report {
        limit_req zone=flood_reports burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        # An explicit admin collection can outlive normal read request timeouts.
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
}
